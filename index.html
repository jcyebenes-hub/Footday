
<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickMaster - Elite Match Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      :root {
        --transition-speed: 250ms;
      }

      body {
        font-family: 'Inter', sans-serif;
        transition: background-color var(--transition-speed), color var(--transition-speed);
      }

      .dark body {
        background-color: #000000;
        color: rgba(255, 255, 255, 0.92);
      }

      .theme-transition * {
        transition: background-color var(--transition-speed) ease, 
                    border-color var(--transition-speed) ease, 
                    color var(--transition-speed) ease !important;
      }

      /* Custom animations */
      .animate-fade-in {
        animation: fadeIn var(--transition-speed) ease-in-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <script>
      // Force Tailwind to use class strategy for dark mode
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              pickBlack: '#000000',
              pickGray: '#121212',
              pickBorder: '#232323',
              pickRed: '#FF3B30',
              pickGreen: '#00FF00',
              pickTextPrimary: 'rgba(255, 255, 255, 0.92)',
              pickTextSecondary: '#C8C8C8',
              pickTextDisabled: '#6E6E6E'
            }
          }
        }
      }
    </script>
<script type="importmap">

}
</script>

</head>

</body>
</html>
