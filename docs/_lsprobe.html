<!DOCTYPE html><html><head><meta charset="utf-8"><title>lsprobe</title></head>
<body><h1 id="x">start</h1>
<script>
var r = [];
try { localStorage.setItem('t','1'); r.push('LS_OK'); } catch(e) { r.push('LS_BLOCKED:' + e.name); }
try { r.push('COOKIE:' + (document.cookie === '' ? 'empty' : 'ok')); } catch(e) { r.push('COOKIE_THROW'); }
try { r.push('ORIGIN:' + location.origin); } catch(e) { r.push('ORIGIN_THROW'); }
document.getElementById('x').textContent = 'RESULT-' + r.join('|');
</script>
</body></html>
