# Blueprint para desplegar en Render como Web Service (Node + Express).
# En Render: New + -> Blueprint -> conecta este repo. Luego rellena las env vars.
services:
  - type: web
    name: footday
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Necesaria en BUILD (Vite la incrusta) y en RUNTIME:
      - key: GEMINI_API_KEY
        sync: false
      # Proveedores de fútbol (opcionales: hay cascada con fallbacks gratuitos)
      - key: FOOTBALL_API_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      # Extras (opcionales)
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
